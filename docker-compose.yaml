services:
  # AWS
  floci:
    image: floci/floci:2.1.0-compat
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # # Azure
  # floci-az:
  #   image: floci/floci-az:0.13.0-compat
  #   ports:
  #     - "4577:4577"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock  # required for Azure Functions

  # # GCP
  # floci-gcp:
  #   image: floci/floci-gcp:0.9.0-compat
  #   ports:
  #     - "4588:4588"
  #   volumes:
  #     - ./data:/app/data
  #     - /var/run/docker.sock:/var/run/docker.sock  # Cloud Run, Cloud SQL, Kafka, GKE

  ui:
    image: floci/floci-ui:0.5.0
    ports:
      - 4500:4500
    environment:
      - FLOCI_ENDPOINT=http://floci:4566
      - FLOCI_AZURE_ENDPOINT=http://floci-az:4577
      - FLOCI_AZURE_ACCOUNT_NAME=devstoreaccount1
      - FLOCI_GCP_ENDPOINT=http://floci-gcp:4588
      - FLOCI_GCP_PROJECT=floci-local
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test